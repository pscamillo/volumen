[project]
name = "volumen"
version = "0.1.0"
description = "The whole loop, in one place, for the Herculaneum scrolls: make surfaces, flatten, cut, judge."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paulo Sergio Camillo" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyside6>=6.6",
    "zarr>=2.16,<3",
    "fsspec",
    "aiohttp",
    "requests",
    "numpy",
    "tifffile",
    "imagecodecs",
    "pillow",
]

[tool.uv]
package = false
